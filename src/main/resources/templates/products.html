<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Product Management</span>
        <button class="btn btn-danger btn-sm" id="logoutBtn">Logout</button>
    </div>
</nav>

<div class="container mt-4">

    <!-- Search and Filter -->
    <div class="card p-3 mb-4 shadow-sm">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" id="searchName" class="form-control" placeholder="Search by name">
            </div>
            <div class="col-md-3">
                <input type="number" id="minPrice" class="form-control" placeholder="Min Price">
            </div>
            <div class="col-md-3">
                <input type="number" id="maxPrice" class="form-control" placeholder="Max Price">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" id="searchBtn">Search</button>
            </div>
        </div>
    </div>

    <!-- Add Product Form -->
    <div class="card p-4 shadow-sm mb-4">
        <h5 id="formTitle">Add New Product</h5>
        <form id="productForm">
            <input type="hidden" id="productId">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="description" class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" id="price" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100" id="saveBtn">Save</button>
        </form>
    </div>

    <!-- Product Table -->
    <div class="card shadow-sm p-3">
        <h5>Product List</h5>
        <table class="table table-striped align-middle mt-3">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        alert("Please login first.");
        window.location.href = '/login';
    }

    // Base API URL
    const API_URL = '/api/products';

    // Load products on page load
    document.addEventListener('DOMContentLoaded', loadProducts);

    // Fetch all products
    async function loadProducts() {
        const res = await fetch(API_URL, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const products = await res.json();

        const tbody = document.getElementById('productTable');
        tbody.innerHTML = '';
        products.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.description}</td>
                    <td>Rp ${p.price.toLocaleString()}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // Save or Update Product
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('productId').value;
        const name = document.getElementById('name').value;
        const description = document.getElementById('description').value;
        const price = parseFloat(document.getElementById('price').value);

        const product = { name, description, price };
        let method = 'POST';
        let url = API_URL;

        if (id) {
            method = 'PUT';
            url = `${API_URL}/${id}`;
        }

        const res = await fetch(url, {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(product)
        });

        if (res.ok) {
            alert('Product saved successfully!');
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Product';
            loadProducts();
        } else {
            alert('Error saving product');
        }
    });

    // Edit Product
    async function editProduct(id) {
        const res = await fetch(`${API_URL}/${id}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const p = await res.json();

        document.getElementById('productId').value = p.id;
        document.getElementById('name').value = p.name;
        document.getElementById('description').value = p.description;
        document.getElementById('price').value = p.price;
        document.getElementById('formTitle').textContent = 'Edit Product';
    }

    // Delete Product
    async function deleteProduct(id) {
        if (!confirm('Are you sure?')) return;

        const res = await fetch(`${API_URL}/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
            alert('Product deleted');
            loadProducts();
        } else {
            alert('Error deleting product');
        }
    }

    // Search / Filter
    document.getElementById('searchBtn').addEventListener('click', async () => {
        const name = document.getElementById('searchName').value;
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;

        let query = [];
        if (name) query.push(`name=${name}`);
        if (minPrice) query.push(`minPrice=${minPrice}`);
        if (maxPrice) query.push(`maxPrice=${maxPrice}`);

        const res = await fetch(`${API_URL}/search?${query.join('&')}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const products = await res.json();
        const tbody = document.getElementById('productTable');
        tbody.innerHTML = '';
        products.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.description}</td>
                    <td>Rp ${p.price.toLocaleString()}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/login';
    });
</script>

</body>
</html>
